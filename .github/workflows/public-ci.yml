name: Public CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checkout-tests:
    name: Public checkout tests and quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: latest-known
          python-version: "3.12"
          enable-cache: true
      - name: Install ffmpeg and ffprobe for video tests
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            archive="$RUNNER_TEMP/ffmpeg-n8.1.3-9-g29e619e767-linux64-gpl-8.1.tar.xz"
            tools="$RUNNER_TEMP/ffmpeg-static"
            # Month-end upstream release; hash copied from its checksums.sha256.
            timeout 240 curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 \
              --silent --show-error \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n8.1.3-9-g29e619e767-linux64-gpl-8.1.tar.xz \
              --output "$archive"
            echo '97ce978979194b5cf7e06a5e68020dbdaa7a4f3294c5452b6a1bc347100dbb79  '"$archive" | sha256sum --check --status
            mkdir -p "$tools"
            tar -xJf "$archive" -C "$tools" --strip-components=2 \
              ffmpeg-n8.1.3-9-g29e619e767-linux64-gpl-8.1/bin/ffmpeg \
              ffmpeg-n8.1.3-9-g29e619e767-linux64-gpl-8.1/bin/ffprobe
            chmod +x "$tools/ffmpeg" "$tools/ffprobe"
            echo "$tools" >> "$GITHUB_PATH"
            export PATH="$tools:$PATH"
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
      # A private checkout first exports the public allowlist. Once this file
      # lives in the fresh-history repo, the same script checks that checkout.
      - name: Test and statically check public tree, then run quickstart
        run: bash scripts/test_public_export.sh

  text-image:
    name: Public text-only image and chat smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build public image and serve a chat turn
        run: bash scripts/smoke_text_container.sh

  audit:
    name: Public dependency CVE scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: latest-known
          python-version: "3.12"
          enable-cache: true
      - name: Audit locked dependencies
        run: |
          uv sync --locked --all-groups
          uv run --with pip-audit pip-audit --skip-editable
